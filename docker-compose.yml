services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: pcd
      POSTGRES_USER: pcd
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pcd}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pcd -d pcd"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  app:
    build: .
    image: price-change-detector:local
    env_file: .env
    environment: &database
      DATABASE_URL: postgres://pcd:${POSTGRES_PASSWORD:-pcd}@db:5432/pcd
    ports:
      - "8000:8000"
    volumes: &model-cache
      # The embedding model is downloaded once and survives image rebuilds.
      - model-cache:/models
    depends_on: &wait-for-db
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  scheduler:
    build: .
    image: price-change-detector:local
    command: ["python", "manage.py", "run_scheduler"]
    env_file: .env
    environment: *database
    volumes: *model-cache
    depends_on:
      <<: *wait-for-db
      app:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  model-cache:
