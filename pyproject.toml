[project]
name = "price-change-detector"
version = "0.1.0"
description = "Tracks product prices on web pages: Django admin + FastAPI API"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.12",
    "dj-database-url>=2.2",
    "django>=5.2,<6.0",
    "fastapi>=0.115",
    "httpx>=0.28",
    "lxml>=5.3",
    "soupsieve>=2.5",
    "uvicorn[standard]>=0.32",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "pytest-django>=4.9",
    "respx>=0.22",
    "ruff>=0.8",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.test_settings"
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"
# Starlette 1.x warns that its TestClient prefers httpx2; httpx is what the project depends on.
filterwarnings = [
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]

[tool.coverage.run]
source = ["src"]
omit = ["src/manage.py", "*/migrations/*"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "."]
extend-exclude = ["src/tracker/migrations"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "DJ"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["api", "config", "notifications", "tracker", "tests"]
